<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidature</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark;--bg:light-dark(#f6f7f9,#111318);--card:light-dark(#fff,#191c22);--text:light-dark(#17191d,#f4f5f7);--muted:light-dark(#69707d,#9aa2b1);--border:light-dark(#e3e6eb,#30343d);--accent:light-dark(#2563eb,#6ea0ff);--soft:light-dark(#eef4ff,#1c2a44)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}
header{padding:28px 34px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:end;gap:20px}.title{font-size:28px;font-weight:750}.sub{color:var(--muted);margin-top:5px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:100px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
header{padding:28px 34px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:end;gap:20px}.title{font-size:28px;font-weight:750}.sub{color:var(--muted);margin-top:5px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:100px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
main{padding:24px 34px;max-width:1400px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.toolbar input,.toolbar select,.add input{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:10px 12px}.toolbar input{width:270px}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}.tablewrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:13px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap}td:first-child{font-weight:650}.date{white-space:nowrap;color:var(--muted);font-size:13px}.checks{display:flex;flex-direction:column;gap:7px;min-width:150px}.check{display:flex;align-items:center;gap:7px;font-size:13px}.check input{accent-color:var(--accent);width:16px;height:16px}.comment{width:190px;min-height:54px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px;font:inherit;font-size:12px;resize:vertical}.empty{text-align:center;padding:45px;color:var(--muted)}
.add{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;grid-template-columns:1.2fr 1.2fr 170px auto;gap:10px;align-items:center}.add h3{grid-column:1/-1;margin:0 0 2px;font-size:15px}.danger{background:transparent;color:#d95c5c;border:1px solid var(--border);border-radius:7px;padding:5px 8px;cursor:pointer}.pill{display:inline-block;background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650}
@media(max-width:800px){header{padding:22px 18px;align-items:flex-start;flex-direction:column}main{padding:18px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}.add{grid-template-columns:1fr}.add h3{grid-column:auto}.stats{width:100%}.stat{flex:1;min-width:0}.tablewrap{border-radius:10px}table{min-width:900px}.checks{min-width:125px}.comment{width:150px}}
</style>
</head>
<body><div id="app">
<header><div><div class="title">Candidature</div><div class="sub">Monitora ogni candidatura e avanza nel processo di selezione.</div></div><div class="stats" id="stats"></div></header>
<main><div class="toolbar"><input id="search" placeholder="Cerca azienda o ruolo…"><select id="filter"><option value="all">Tutte le candidature</option><option value="active">In corso</option><option value="offer">Con offerta</option><option value="phone">Colloquio telefonico</option><option value="video">Video call</option><option value="live">Colloquio dal vivo</option></select></div>
<div class="tablewrap"><table><thead><tr><th>Azienda</th><th>Ruolo</th><th>Data</th><th>Colloquio telefonico</th><th>Videocall</th><th>Dal vivo</th><th>Offerta</th><th>Commenti</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="add"><h3>+ Nuova candidatura</h3><input id="company" placeholder="Azienda"><input id="role" placeholder="Ruolo"><input id="date" type="date"><button class="btn" id="addBtn">Aggiungi</button></section>
</main></div>
<script>
const key='candidature_tracker_v1';let data=JSON.parse(localStorage.getItem(key)||'[]');
const stages=[['phone1','1° colloquio','telefonico'],['phone2','2° colloquio','telefonico'],['video1','1° colloquio','videocall'],['video2','2° colloquio','videocall'],['live1','1° colloquio','dal vivo'],['live2','2° colloquio','dal vivo'],['offer','Offerta','offerta']];
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const q=document.getElementById('search').value.toLowerCase(), f=document.getElementById('filter').value;let shown=data.filter(x=>(!q||(x.company+' '+x.role).toLowerCase().includes(q))&&(f==='all'||(f==='offer'?x.offer:f==='active'?!x.offer:f==='phone'?(x.phone1||x.phone2):f==='video'?(x.video1||x.video2):f==='live'?(x.live1||x.live2):true)));document.getElementById('rows').innerHTML=shown.length?shown.map(x=>`<tr><td>${esc(x.company)}</td><td>${esc(x.role)}</td><td class="date">${esc(x.date)}</td>${['phone','video','live'].map(group=>`<td><div class="checks">${[1,2].map(n=>{let k=group+n;return `<label class="check"><input type="checkbox" data-id="${x.id}" data-key="${k}" ${x[k]?'checked':''}> ${n}° colloquio</label>`}).join('')}</div></td>`).join('')}<td><label class="check"><input type="checkbox" data-id="${x.id}" data-key="offer" ${x.offer?'checked':''}> Offerta</label></td><td><textarea class="comment" data-id="${x.id}" placeholder="Note / commenti…">${esc(x.comment)}</textarea></td><td><button class="danger" data-del="${x.id}">Elimina</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">Nessuna candidatura. Aggiungine una qui sotto.</td></tr>`;
const total=data.length, active=data.filter(x=>!x.offer).length, offers=data.filter(x=>x.offer).length, interviews=data.filter(x=>x.phone1||x.phone2||x.video1||x.video2||x.live1||x.live2).length;document.getElementById('stats').innerHTML=`<div class="stat"><b>${total}</b><span>Totali</span></div><div class="stat"><b>${active}</b><span>In corso</span></div><div class="stat"><b>${interviews}</b><span>Con colloqui</span></div><div class="stat"><b>${offers}</b><span>Offerte</span></div>`}
document.getElementById('addBtn').onclick=()=>{let c=company.value.trim(),r=role.value.trim(),d=date.value;if(!c||!r||!d)return alert('Inserisci azienda, ruolo e data.');data.push({id:Date.now(),company:c,role:r,date:d,phone1:false,phone2:false,video1:false,video2:false,live1:false,live2:false,offer:false,comment:''});company.value=role.value=date.value='';save()};
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;
document.getElementById('rows').onchange=e=>{let id=e.target.dataset.id,k=e.target.dataset.key;if(id&&k){let x=data.find(z=>z.id==id);x[k]=e.target.checked;save()}};
document.getElementById('rows').oninput=e=>{if(e.target.classList.contains('comment')){let x=data.find(z=>z.id==e.target.dataset.id);x.comment=e.target.value;localStorage.setItem(key,JSON.stringify(data))}};
document.getElementById('rows').onclick=e=>{let id=e.target.dataset.del;if(id){data=data.filter(x=>x.id!=id);save()}};render();
</script></body></html>
